name: Build AmneziaWG Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/build-binaries.yml'

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned SteamOS runtime
        run: |
          docker build -f infra/Dockerfile -t vpn-deck-awg-builder .
          cid=$(docker create vpn-deck-awg-builder)
          mkdir -p binaries
          docker cp "$cid:/binaries/." binaries/
          docker rm "$cid"
          test -x binaries/amneziawg-go
          test -x binaries/awg
          test -x binaries/awg-quick
          grep -q 'endpoint-direct-route' binaries/awg-quick
          cat binaries/versions.json

      - name: Archive runtime
        run: tar -czf amneziawg-runtime-steamos-amd64.tar.gz -C binaries .

      - uses: actions/upload-artifact@v4
        with:
          name: amneziawg-runtime-steamos-amd64
          path: amneziawg-runtime-steamos-amd64.tar.gz
          retention-days: 30
