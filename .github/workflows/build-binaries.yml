name: Build Decky Package

on:
  workflow_dispatch:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/index.js

      - name: Build pinned SteamOS runtime
        run: |
          docker build -f infra/Dockerfile -t vpn-deck-awg-builder .
          cid=$(docker create vpn-deck-awg-builder /bin/true)
          mkdir -p binaries
          docker cp "$cid:/binaries/." binaries/
          docker rm "$cid"
          test -x binaries/amneziawg-go
          test -x binaries/awg
          test -x binaries/awg-quick
          bash -n binaries/awg-quick
          grep -q 'endpoint-direct-route' binaries/awg-quick
          grep -q 'ENDPOINT_RULE_PREF=10000' binaries/awg-quick
          grep -q 'rule add pref.*to.*lookup main' binaries/awg-quick
          grep -q 'v3.1.20260814' binaries/versions.json
          grep -q 'v3.1.20260812' binaries/versions.json
          grep -q 'allow-empty-I1-I5' binaries/versions.json
          cat binaries/versions.json

      - name: Package Decky plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ROOT="stage/vpn-deck"
          mkdir -p "$ROOT/bin"
          cp -a dist py_modules "$ROOT/"
          cp -a binaries/amneziawg-go binaries/awg binaries/awg-quick binaries/versions.json "$ROOT/bin/"
          cp main.py package.json plugin.json LICENSE README.md README.ru.md "$ROOT/"
          chmod 0755 "$ROOT/bin/amneziawg-go" "$ROOT/bin/awg" "$ROOT/bin/awg-quick"
          (cd stage && zip -r "../vpn-deck-awg-v${VERSION}.zip" vpn-deck)
          unzip -l "vpn-deck-awg-v${VERSION}.zip"
          unzip -p "vpn-deck-awg-v${VERSION}.zip" vpn-deck/plugin.json >/dev/null
          unzip -p "vpn-deck-awg-v${VERSION}.zip" vpn-deck/dist/index.js >/dev/null
          unzip -p "vpn-deck-awg-v${VERSION}.zip" vpn-deck/main.py >/dev/null
          unzip -p "vpn-deck-awg-v${VERSION}.zip" vpn-deck/bin/amneziawg-go >/dev/null
          echo "PACKAGE=vpn-deck-awg-v${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Archive runtime
        run: tar -czf amneziawg-runtime-steamos-amd64.tar.gz -C binaries .

      - uses: actions/upload-artifact@v4
        with:
          name: vpn-deck-awg-decky-zip
          path: ${{ env.PACKAGE }}
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: amneziawg-runtime-steamos-amd64
          path: amneziawg-runtime-steamos-amd64.tar.gz
          retention-days: 30
